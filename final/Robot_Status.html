<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Robot Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }

  /* ── Header ── */
  .header {
    width: 100%; max-width: 400px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .header h1 { font-size: 0.85rem; letter-spacing: 3px; color: #555; text-transform: uppercase; }
  .conn-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.72rem; color: #444; letter-spacing: 1px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #333; transition: background 0.3s;
  }
  .dot.live { background: #00e676; box-shadow: 0 0 8px #00e676aa; animation: blink 1.5s infinite; }
  .dot.error { background: #ff5252; }
  @keyframes blink {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  /* ── State Card ── */
  .state-card {
    width: 100%; max-width: 400px;
    border-radius: 24px;
    padding: 36px 24px 28px;
    text-align: center;
    border: 2px solid #1e1e2a;
    margin-bottom: 16px;
    transition: border-color 0.4s, background 0.4s;
    background: #13131c;
  }
  .state-icon { font-size: 4.5rem; margin-bottom: 14px; line-height: 1; }
  .state-name {
    font-size: 2.4rem; font-weight: 800;
    letter-spacing: 5px; margin-bottom: 8px;
    transition: color 0.3s;
  }
  .state-desc { font-size: 0.8rem; letter-spacing: 2px; color: #444; }

  /* State-specific colors */
  .s-IDLE    .state-name { color: #4a9eff; }
  .s-IDLE    { border-color: #0d2a45; }
  .s-WALKING .state-name { color: #00e676; }
  .s-WALKING { border-color: #003d1a; }
  .s-KICKING .state-name { color: #ff5252; }
  .s-KICKING { border-color: #4a0a0a; }
  .s-SEARCHING .state-name { color: #ffd740; }
  .s-SEARCHING { border-color: #4a3800; }

  /* ── Info Row ── */
  .info-row {
    width: 100%; max-width: 400px;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 16px;
  }
  .info-card {
    background: #13131c;
    border: 2px solid #1e1e2a;
    border-radius: 18px;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .info-label { font-size: 0.68rem; letter-spacing: 2px; color: #444; text-transform: uppercase; }
  .info-value { font-size: 1.4rem; font-weight: 700; }
  .ball-yes { color: #00e676; }
  .ball-no  { color: #333; }
  .dist-ok  { color: #4a9eff; }
  .dist-warn { color: #ffd740; }
  .dist-danger { color: #ff5252; }

  /* ── Log ── */
  .log-box {
    width: 100%; max-width: 400px;
    background: #0d0d14;
    border: 1px solid #1a1a28;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: #555;
    height: 90px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .log-box p { margin-bottom: 3px; }
  .log-box p span { color: #2a7a4a; margin-right: 6px; }

  /* ── Footer ── */
  .footer {
    font-size: 0.68rem; color: #2a2a3a; letter-spacing: 1px; text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>Robot Status</h1>
  <div class="conn-badge">
    <div class="dot" id="dot"></div>
    <span id="connTxt">connecting…</span>
  </div>
</div>

<!-- State card -->
<div class="state-card s-IDLE" id="stateCard">
  <div class="state-icon" id="stateIcon"></div>
  <div class="state-name" id="stateName">IDLE</div>
  <div class="state-desc" id="stateDesc">Waiting for command</div>
</div>

<!-- Ball + Distance -->
<div class="info-row">
  <div class="info-card">
    <div class="info-label">Ball Detected</div>
    <div class="info-value ball-no" id="ballVal">✗ NO</div>
  </div>
  <div class="info-card">
    <div class="info-label">Obstacle</div>
    <div class="info-value dist-ok" id="distVal">— cm</div>
  </div>
</div>

<!-- Activity log -->
<div class="log-box" id="logBox"></div>

<div class="footer" id="lastPoll">Last poll: —</div>

<script>
  // ─── CONFIG: change this to your ESP32 IP ───────────────────────────────
  const ESP_IP   = "10.131.220.220";   // e.g. "192.168.1.105"
  const ESP_PORT = 8080;
  const POLL_MS  = 500;
  // ─────────────────────────────────────────────────────────────────────────

  const URL = `http://${ESP_IP}:${ESP_PORT}/status`;

  const STATE_INFO = {
    IDLE:      { desc: "Waiting for command",  cls: "s-IDLE"     },
    WALKING:   { desc: "Moving toward target",  cls: "s-WALKING"  },
    KICKING:   { desc: "Executing kick!",       cls: "s-KICKING"  },
    SEARCHING: { desc: "Scanning for the ball", cls: "s-SEARCHING"}
  };

  let lastState = null;

  function log(msg) {
    const box = document.getElementById('logBox');
    const p   = document.createElement('p');
    const t   = new Date().toLocaleTimeString('en-GB');
    p.innerHTML = `<span>${t}</span>${msg}`;
    box.insertBefore(p, box.firstChild);
    if (box.children.length > 20) box.removeChild(box.lastChild);
  }

  function applyState(state, ball, dist) {
    const info = STATE_INFO[state] || STATE_INFO.IDLE;

    // State card
    const card = document.getElementById('stateCard');
    card.className = 'state-card ' + info.cls;
    document.getElementById('stateIcon').textContent = info.icon;
    document.getElementById('stateName').textContent = state;
    document.getElementById('stateDesc').textContent = info.desc;

    // Ball
    const bEl = document.getElementById('ballVal');
    if (ball) {
      bEl.textContent = '✓ YES';
      bEl.className   = 'info-value ball-yes';
    } else {
      bEl.textContent = '✗ NO';
      bEl.className   = 'info-value ball-no';
    }

    // Distance
    const dEl = document.getElementById('distVal');
    if (dist >= 999) {
      dEl.textContent = '> 100 cm';
      dEl.className   = 'info-value dist-ok';
    } else {
      dEl.textContent = dist.toFixed(1) + ' cm';
      dEl.className   = 'info-value ' + (dist < 20 ? 'dist-danger' : dist < 50 ? 'dist-warn' : 'dist-ok');
    }

    // Log on state change
    if (state !== lastState) {
      log(`State changed → ${state}`);
      lastState = state;
    }
  }

  async function poll() {
    try {
      const r = await fetch(URL, { signal: AbortSignal.timeout(1500) });
      const d = await r.json();

      document.getElementById('dot').className    = 'dot live';
      document.getElementById('connTxt').textContent = ESP_IP;
      document.getElementById('lastPoll').textContent =
        'Last poll: ' + new Date().toLocaleTimeString('en-GB');

      applyState(d.state, d.ball, d.distance);

    } catch (e) {
      document.getElementById('dot').className    = 'dot error';
      document.getElementById('connTxt').textContent = 'No connection';
    }
  }

  setInterval(poll, POLL_MS);
  poll();
</script>
</body>
</html>
